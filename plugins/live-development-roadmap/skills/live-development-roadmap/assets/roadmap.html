<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tablero oscuro de una sola escena: barra lateral fija, encabezado con
   métricas, tres paneles y el cuerpo de cada vista. El acento lo define
   cada proyecto (meta/proyecto.acento); los colores de estado son fijos. */
:root {
  --fondo: #0a0e13;
  --panel: #10161d;
  --panel-2: #141c25;
  --linea: #1f2a36;
  --texto: #d8dee6;
  --tenue: #7e8a98;
  --acento: #f0703a;
  --hecho: #7cc4fa;
  --comprometido: #3b4757;
  --provisional: #5d6b7c;
  --bloqueado: #e5484d;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --cuerpo: "Barlow", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fondo); color: var(--texto); font-family: var(--cuerpo); font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 76px 1fr; height: 100%; }
nav.lateral { border-right: 1px solid var(--linea); display: flex; flex-direction: column; align-items: stretch; background: #080b0f; }
.marca { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-align: center; padding: 18px 4px 14px; text-transform: uppercase; overflow-wrap: anywhere; }
.marca::after { content: ""; display: block; width: 22px; height: 2px; background: var(--acento); margin: 6px auto 0; }
.nav-btn { background: none; border: 0; border-left: 2px solid transparent; padding: 14px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav-btn[aria-current="page"] { color: var(--texto); border-left-color: var(--acento); background: var(--panel); }
.nav-btn.abajo { margin-top: auto; }
main { overflow: auto; padding: 22px 28px 40px; min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
.vivo { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--acento); color: var(--acento); padding: 2px 8px; }
.vivo i { width: 7px; height: 7px; border-radius: 50%; background: var(--acento); animation: latido 1.6s infinite; }
.vivo.off { border-color: var(--tenue); color: var(--tenue); }
.vivo.off i { background: var(--tenue); animation: none; }
@keyframes latido { 50% { opacity: .25; } }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 4.4vw, 52px); letter-spacing: .04em; text-transform: uppercase; margin: 6px 0 2px; text-wrap: balance; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 small { font-family: var(--cuerpo); font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--tenue); font-weight: 400; }
.metricas { font-family: var(--mono); font-size: 12.5px; color: var(--tenue); display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.metricas b { color: var(--texto); font-weight: 600; }
.paneles { margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--linea); position: relative; }
.paneles::before, .paneles::after { content: ""; position: absolute; width: 10px; height: 10px; border-color: var(--texto); border-style: solid; opacity: .5; }
.paneles::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.paneles::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
.panel { padding: 16px 18px; min-width: 0; }
.panel + .panel { border-left: 1px solid var(--linea); }
.panel h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
.encurso-titulo { font-family: var(--display); font-weight: 600; font-size: 21px; display: flex; gap: 10px; align-items: baseline; }
.codigo { font-family: var(--mono); font-size: .8em; color: var(--acento); }
.sub { color: var(--tenue); margin: 4px 0 10px; }
.fila-dato { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12.5px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.fila-dato span:first-child { color: var(--tenue); }
.barra { height: 6px; background: var(--panel-2); margin: 8px 0 12px; position: relative; overflow: hidden; }
.barra > i { position: absolute; inset: 0 auto 0 0; background: var(--hecho); }
.barra.rayada > i { background: repeating-linear-gradient(-45deg, var(--acento) 0 6px, color-mix(in srgb, var(--acento) 55%, #000) 6px 12px); }
.barra.excedida > i { background: repeating-linear-gradient(-45deg, var(--bloqueado) 0 6px, #7a1d20 6px 12px); }
.porcentaje { font-family: var(--display); font-weight: 600; font-size: 44px; line-height: 1; }
.porcentaje small { font-family: var(--mono); font-size: 13px; color: var(--tenue); font-weight: 400; margin-left: 8px; }
.cambios { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cambios li { display: grid; grid-template-columns: 44px 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.cambios time { font-family: var(--mono); color: var(--tenue); }
.cambios .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cambios svg { width: 14px; height: 14px; stroke: var(--tenue); fill: none; stroke-width: 1.8; }
.diff { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.mas { color: #4fd18b; } .menos { color: #f07178; }
.vacio { color: var(--tenue); font-style: italic; }
.barra-herr { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 26px 0 0; }
.tabs { display: flex; }
.tab { background: var(--panel); border: 1px solid var(--linea); padding: 9px 22px; font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: var(--tenue); }
.tab[aria-selected="true"] { color: var(--texto); border-bottom: 2px solid var(--hecho); background: var(--panel-2); }
.herr { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.herr input[type=search] { background: var(--panel); border: 1px solid var(--linea); color: var(--texto); padding: 8px 10px; min-width: 200px; font: inherit; }
.chip { background: var(--panel); border: 1px solid var(--linea); padding: 7px 12px; font-family: var(--display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--tenue); display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { color: #0a0e13; background: var(--hecho); border-color: var(--hecho); }
.chip.estado[aria-pressed="true"] { background: var(--panel-2); color: var(--texto); }
.chip .pt { width: 8px; height: 8px; display: inline-block; }
.espacio { flex: 1; }
.select { background: var(--panel); border: 1px solid var(--linea); color: var(--texto); padding: 7px 10px; font: inherit; }
.gantt { margin-top: 10px; border: 1px solid var(--linea); display: grid; grid-template-columns: 300px minmax(0, 1fr); background: var(--panel); }
.g-izq { border-right: 1px solid var(--linea); min-width: 0; }
.g-cab { height: 52px; border-bottom: 1px solid var(--linea); display: flex; align-items: flex-end; padding: 0 14px 8px; font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--tenue); position: relative; }
.g-fila { height: 31px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid color-mix(in srgb, var(--linea) 55%, transparent); white-space: nowrap; overflow: hidden; }
.g-fila.fase { background: var(--panel-2); font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13.5px; cursor: pointer; }
.g-fila.fase .cnt { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--tenue); letter-spacing: 0; }
.g-fila.tarea { padding-left: 26px; cursor: pointer; }
.g-fila.tarea:hover { background: color-mix(in srgb, var(--hecho) 6%, transparent); }
.g-fila .tit { overflow: hidden; text-overflow: ellipsis; }
.caret { width: 10px; transition: transform .15s; display: inline-block; color: var(--tenue); }
.abierta .caret { transform: rotate(90deg); }
.cuad { width: 8px; height: 8px; flex: none; }
.g-der { position: relative; overflow: hidden; min-width: 0; }
.g-dias, .g-horas { position: absolute; left: 0; right: 0; font-family: var(--mono); font-size: 11px; color: var(--tenue); }
.g-dias { top: 6px; height: 18px; }
.g-horas { top: 30px; height: 18px; }
.g-dias span, .g-horas span { position: absolute; white-space: nowrap; transform: translateX(-50%); }
.g-dias span { transform: none; padding-left: 6px; color: var(--texto); font-weight: 600; text-transform: uppercase; }
.g-linea-dia { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--linea); }
.g-grilla { position: absolute; top: 52px; bottom: 0; width: 1px; background: color-mix(in srgb, var(--linea) 60%, transparent); }
.g-ahora { position: absolute; top: 28px; bottom: 0; width: 0; border-left: 1px dashed var(--acento); z-index: 3; }
.g-ahora b { position: absolute; top: 0; left: 0; transform: translateX(-50%); background: var(--acento); color: #0a0e13; font-family: var(--display); font-size: 11px; letter-spacing: .1em; padding: 1px 6px; }
.g-filas { position: absolute; top: 52px; left: 0; right: 0; }
.g-barra-fila { position: relative; height: 31px; border-bottom: 1px solid color-mix(in srgb, var(--linea) 55%, transparent); }
.g-barra-fila.fase { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
.bar { position: absolute; top: 9px; height: 13px; min-width: 3px; cursor: pointer; }
.bar.hecho { background: var(--hecho); }
.bar.en_curso { background: repeating-linear-gradient(-45deg, var(--acento) 0 6px, color-mix(in srgb, var(--acento) 55%, #000) 6px 12px); }
.bar.comprometido { background: var(--comprometido); border: 1px solid #56657a; }
.bar.provisional { border: 1px dashed var(--provisional); background: transparent; }
.bar.bloqueado { background: repeating-linear-gradient(45deg, var(--bloqueado) 0 4px, transparent 4px 8px); border: 1px solid var(--bloqueado); }
.bar.fase { top: 11px; height: 9px; opacity: .9; }
.bar-et { position: absolute; top: 7px; font-size: 12px; color: var(--tenue); white-space: nowrap; pointer-events: none; z-index: 1; text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel), 0 0 6px var(--panel); }
.g-pausa { position: absolute; top: 52px; bottom: 0; z-index: 0; border-left: 1px dashed color-mix(in srgb, var(--tenue) 40%, transparent); border-right: 1px dashed color-mix(in srgb, var(--tenue) 40%, transparent); pointer-events: none; }
.g-pausa > i { position: absolute; top: 0; bottom: 0; pointer-events: auto; }
.g-pausa > i.limite_uso { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--tenue) 13%, transparent) 0 4px, transparent 4px 12px), color-mix(in srgb, var(--tenue) 6%, transparent); }
.g-pausa > i:not(.limite_uso) { background: color-mix(in srgb, var(--tenue) 7%, transparent); }
.g-pausa-et { position: absolute; top: 5px; height: 18px; line-height: 18px; padding: 0 4px; text-align: center; overflow: hidden; text-overflow: ellipsis; font-family: var(--display); font-weight: 600; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); white-space: nowrap; border-bottom: 1px dashed color-mix(in srgb, var(--tenue) 45%, transparent); z-index: 2; }
.g-pausa-et::before { content: ""; display: inline-block; vertical-align: -1px; margin-right: 5px; width: 9px; height: 9px; background: repeating-linear-gradient(135deg, var(--tenue) 0 1px, transparent 1px 3px); }
.bar-hueco { position: absolute; top: -1px; bottom: -1px; background: color-mix(in srgb, var(--panel) 78%, transparent); }
.pausa-activa { margin-top: 8px; padding: 6px 8px; border: 1px dashed color-mix(in srgb, var(--tenue) 60%, transparent); font-size: 12.5px; color: var(--texto); }
.leyenda { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--tenue); margin-top: 10px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 16px; height: 9px; display: inline-block; }
.tablero { margin-top: 12px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.col { border: 1px solid var(--linea); border-top: 2px solid var(--provisional); background: var(--panel); padding: 14px 12px; min-width: 0; }
.col.hecha { border-top-color: var(--hecho); }
.col.curso { border-top-color: var(--acento); }
.col.comprometida { border-top-color: #8a9bb0; }
.col-cab { text-align: center; }
.col-cab .ver { font-family: var(--display); font-size: 11px; letter-spacing: .14em; color: var(--tenue); text-transform: uppercase; }
.col-cab .nom { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; }
.col-cab .desc { color: var(--tenue); margin: 2px 0 8px; }
.sello { display: inline-flex; gap: 6px; align-items: center; border: 1px solid currentColor; padding: 3px 8px; font-family: var(--display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 11.5px; }
.cat { border: 1px solid var(--linea); background: var(--panel-2); margin-top: 10px; }
.cat-cab { width: 100%; background: none; border: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left; }
.cat-cab b { display: block; font-weight: 600; }
.cat-cab small { color: var(--tenue); }
.puntos { margin-left: auto; display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 90px; }
.puntos i { width: 7px; height: 7px; display: inline-block; }
.tarjeta { margin: 0 8px 8px; border: 1px solid var(--linea); background: var(--panel); cursor: pointer; }
.tarjeta-banda { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-family: var(--display); font-weight: 600; letter-spacing: .1em; font-size: 11px; text-transform: uppercase; }
.tarjeta-tit { padding: 6px 8px 8px; font-weight: 600; }
.tarjeta img { display: block; width: 100%; max-height: 120px; object-fit: cover; }
.notas { margin-top: 18px; display: grid; gap: 10px; max-width: 860px; }
.nota { border: 1px solid var(--linea); border-left: 3px solid var(--provisional); background: var(--panel); padding: 12px 14px; }
.nota.decision { border-left-color: var(--hecho); }
.nota.riesgo { border-left-color: var(--bloqueado); }
.nota.resumen { border-left-color: var(--acento); }
.nota-cab { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 11.5px; color: var(--tenue); text-transform: uppercase; }
.nota p { margin: 6px 0 0; white-space: pre-wrap; line-height: 1.5; max-width: 70ch; }
.guia { border: 1px solid var(--linea); padding: 14px 16px; background: var(--panel-2); max-width: 860px; margin-top: 18px; line-height: 1.55; }
.guia h3 { margin: 0 0 6px; font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; font-size: 14px; }
.guia ul { margin: 6px 0 0; padding-left: 18px; }
dialog { background: var(--panel); color: var(--texto); border: 1px solid var(--linea); padding: 0; width: min(1080px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(3, 5, 8, .72); }
.det-cab { display: flex; align-items: flex-start; gap: 16px; padding: 18px 20px 14px; border-bottom: 1px solid var(--linea); }
.det-cab h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 28px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.det-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; color: var(--tenue); align-items: center; }
.cerrar { margin-left: auto; background: none; border: 1px solid var(--linea); width: 36px; height: 36px; font-size: 18px; flex: none; }
.det-cuerpo { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; padding: 18px 20px 22px; }
.det-cuerpo h3 { margin: 14px 0 6px; font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--tenue); }
.det-cuerpo h3:first-child { margin-top: 0; }
.det-cuerpo p { margin: 0; line-height: 1.55; white-space: pre-wrap; }
.galeria img.principal { width: 100%; max-height: 330px; object-fit: contain; background: #05070a; border: 1px solid var(--linea); }
.miniaturas { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.miniaturas button { border: 1px solid var(--linea); padding: 0; background: #05070a; }
.miniaturas button[aria-pressed="true"] { border-color: var(--hecho); }
.miniaturas img { display: block; width: 76px; height: 46px; object-fit: cover; }
.archivo { font-family: var(--mono); font-size: 11.5px; color: var(--tenue); margin-top: 6px; text-transform: uppercase; overflow-wrap: anywhere; }
.disc-barra { display: grid; grid-template-columns: 140px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; margin: 5px 0; }
.disc-barra .barra { margin: 0; }
.disc-barra span:last-child { font-family: var(--mono); text-align: right; color: var(--tenue); }
.commit { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; margin-bottom: 8px; }
.commit b { color: var(--hecho); font-weight: 600; }
.dep { font-family: var(--mono); font-size: 12px; border: 1px solid var(--hecho); color: var(--hecho); padding: 1px 6px; margin-right: 4px; background: none; }
.aviso { margin-top: 30px; padding: 18px; border: 1px dashed var(--linea); color: var(--tenue); max-width: 720px; line-height: 1.55; }
@media (max-width: 900px) {
  .paneles { grid-template-columns: 1fr; }
  .panel + .panel { border-left: 0; border-top: 1px solid var(--linea); }
  .gantt { grid-template-columns: 180px minmax(0, 1fr); }
  .det-cuerpo { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav.lateral { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--linea); }
  .marca { display: none; }
  .nav-btn { flex: 1; border-left: 0; border-bottom: 2px solid transparent; }
  .nav-btn[aria-current="page"] { border-bottom-color: var(--acento); }
  .nav-btn.abajo { margin-top: 0; }
  main { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { .vivo i { animation: none; } .caret { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <nav class="lateral" aria-label="Secciones">
    <div class="marca" id="marca">Roadmap</div>
    <button class="nav-btn" data-ir="seguimiento" id="nav-seguimiento">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h14"/></svg><span data-t="seguimiento"></span>
    </button>
    <button class="nav-btn" data-ir="versiones" id="nav-versiones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="16"/><rect x="14" y="4" width="6" height="10"/></svg><span data-t="versiones"></span>
    </button>
    <button class="nav-btn abajo" data-ir="notas" id="nav-notas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="M12 8v5M12 16v.5"/></svg><span data-t="notas"></span>
    </button>
  </nav>
  <main id="raiz" aria-live="polite"></main>
</div>
<dialog id="detalle" aria-labelledby="det-titulo"></dialog>
<script>
"use strict";
// ── Textos (es / en). La redacción del CONTENIDO la decide quien escribe en
// la base (flag simple/tech del proyecto); acá solo va la interfaz.
const TXT = {
  es: {
    seguimiento: "Seguimiento", versiones: "Versiones", notas: "Notas", hojaDeRuta: "Hoja de ruta", enVivo: "En vivo", sinConexion: "Sin conexión",
    tituloSeg: "Seguimiento del progreso", tituloVer: "Vista de versiones", tituloNotas: "Notas y decisiones", actualizado: "Actualizado", hace: "hace",
    versionDev: "Versión en desarrollo", de: "de", tareas: "tareas", decisiones: "decisiones", lineas: "líneas", ultimoCommit: "último commit",
    ahoraMismo: "Ahora mismo · en curso", empezo: "Empezó a las", lleva: "lleva", previsto: "previsto", nadaEnCurso: "Nada en curso.", siguiente: "Sigue",

const ZOOMS = [["6h", 6 * 36e5], ["1d", 24 * 36e5], ["3d", 72 * 36e5], ["1s", 7 * 864e5], ["1m", 30 * 864e5], ["3m", 91 * 864e5]];

const idioma = () => (S.meta && S.meta.idioma === "en" ? "en" : "es");

const et = (k, def) => (S.meta && S.meta.etiquetas && S.meta.etiquetas[k]) || def;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ms = (iso) => (iso ? new Date(iso).getTime() : NaN);
const loc = () => (idioma() === "en" ? "en-US" : "es-AR");
const hora = (x) => new Date(x).toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit", hour12: false });
const fecha = (x) => new Date(x).toLocaleDateString(loc(), { day: "numeric", month: "short" });
const fechaHora = (x) => `${fecha(x)}, ${hora(x)}`;
function dur(min) {
  if (!isFinite(min)) return t("sinDato");

  const h = Math.floor(min / 60), m = min % 60;
  if (h < 48) return m ? `${h} h ${m} min` : `${h} h`;
  return `${Math.round(h / 24)} d`;
}
function haceTxt(x) {

  return idioma() === "en" ? (min < 1 ? d : `${d} ago`) : (min < 1 ? d : `${t("hace")} ${d}`);
}
const disciplinas = () => (S.meta && Array.isArray(S.meta.disciplinas) ? S.meta.disciplinas : []);
const nombreDisc = (id) => (disciplinas().find((d) => d.id === id) || {}).nombre || id;

// ── Modelo derivado
function versionActual() {
  const id = UI.version || (S.meta && S.meta.versionActual) || (S.versiones.find((v) => v.estado === "en_desarrollo") || {}).id || (S.versiones[0] || {}).id;
  return S.versiones.find((v) => v.id === id) || (id ? { id } : null);
}
function datosVersion(vid) {
  const fases = S.fases.filter((f) => f.version === vid).sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));
  const ordenFase = new Map(fases.map((f, i) => [f.id, i]));
  const ents = S.entregables.filter((e) => e.version === vid)
    .sort((a, b) => (ordenFase.get(a.fase) ?? 99) - (ordenFase.get(b.fase) ?? 99) || (a.orden ?? 0) - (b.orden ?? 0) || String(a.id).localeCompare(String(b.id)));
  return { fases, ents };
}
// Pausas (límite de uso, esperando al usuario, fuera de horario): tramos sin
// trabajo. Una pausa sin fin sigue abierta hasta ahora.
function tramosPausa() {
  return S.pausas.map((p) => ({ ...p, a: ms(p.inicio), b: isFinite(ms(p.fin)) ? ms(p.fin) : Date.now() })).filter((p) => isFinite(p.a) && p.b > p.a);
}
const pausaActiva = () => S.pausas.find((p) => isFinite(ms(p.inicio)) && !p.fin);
// Minutos de trabajo entre a y b, descontando las pausas que se superponen.
function minutosEfectivos(a, b) {
  let total = b - a;
  for (const p of tramosPausa()) total -= Math.max(0, Math.min(b, p.b) - Math.max(a, p.a));
  return Math.max(0, total) / 6e4;
}
function ritmoMin(ents) {
  const hechos = ents.filter((e) => e.estado === "hecho" && isFinite(ms(e.inicio)) && isFinite(ms(e.fin)));
  if (!hechos.length) return NaN;
  return hechos.reduce((s, e) => s + minutosEfectivos(ms(e.inicio), ms(e.fin)), 0) / hechos.length;
}
// Proyección: lo pendiente va uno detrás de otro desde "ahora" (o desde el
// fin previsto de lo que está en curso), con sus minutos previstos o, si no
// tiene, el ritmo real.
function proyectar(ents) {
  const ritmo = ritmoMin(ents);
  const ahora = Date.now();
  let cursor = ahora;
  const proy = new Map();
  for (const e of ents) if (e.estado === "en_curso") {
    const ini = ms(e.inicio);
    const finPrev = ini + (e.previstoMin || ritmo || 30) * 6e4;
    proy.set(e.id, { ini, fin: ahora });
    cursor = Math.max(cursor, finPrev);
  }
  for (const e of ents) if (e.estado === "comprometido" || e.estado === "provisional") {
    const minutos = e.previstoMin || (isFinite(ritmo) ? ritmo : 30);
    proy.set(e.id, { ini: cursor, fin: cursor + minutos * 6e4, estimado: true });
    cursor += minutos * 6e4;
  }
  for (const e of ents) if (e.estado === "hecho" && isFinite(ms(e.inicio))) proy.set(e.id, { ini: ms(e.inicio), fin: isFinite(ms(e.fin)) ? ms(e.fin) : ms(e.inicio) });
  return { proy, fin: cursor, ritmo };
}
function estadoFase(f, ents, proy) {
  const propios = ents.filter((e) => e.fase === f.id && e.estado !== "descartado");
  const hechos = propios.filter((e) => e.estado === "hecho");
  const finFase = Math.max(...propios.map((e) => (proy.get(e.id) || {}).fin || 0), 0);
  if (propios.length && hechos.length === propios.length) {
    const ultimo = Math.max(...hechos.map((e) => ms(e.fin) || 0));
    return { clase: "hecha", texto: `${t("completada")} · ${ultimo ? fecha(ultimo) : ""}`, color: "var(--hecho)" };
  }
  if (propios.some((e) => e.estado === "en_curso") || hechos.length) return { clase: "curso", texto: `${t("en_curso")} · ${hechos.length}/${propios.length}`, color: "var(--acento)" };
  if (propios.some((e) => e.estado === "comprometido")) return { clase: "comprometida", texto: `${t("comprometida")} · ${t("est")} ${finFase ? fecha(finFase) : ""}`, color: "#8a9bb0" };
  return { clase: "", texto: `${t("provisionalF")}${finFase ? ` · ${t("est")} ${fecha(finFase)}` : ""}`, color: "var(--provisional)" };
}

// ── Encabezado y paneles (compartidos por Seguimiento y Versiones)
function encabezado(titulo) {
  const v = versionActual();
  const vid = v && v.id;
  const { fases, ents } = vid ? datosVersion(vid) : { fases: [], ents: [] };
  const validos = ents.filter((e) => e.estado !== "descartado");
  const hechos = validos.filter((e) => e.estado === "hecho");
  const { proy, fin, ritmo } = proyectar(ents);
  const commitsV = S.cambios.filter((c) => c.tipo === "commit" && (!vid || c.version === vid));
  const lineas = commitsV.reduce((s, c) => s + (c.mas || 0) + (c.menos || 0), 0);
  const ultimo = S.cambios.find((c) => c.tipo === "commit");
  const decisiones = S.notas.filter((n) => n.tipo === "decision" && (!vid || n.version === vid)).length;
  const verif = S.meta && S.meta.metricas ? S.meta.metricas : {};
  const faseCurso = fases.findIndex((f) => estadoFase(f, ents, proy).clase === "curso");
  const fasesHechas = fases.filter((f) => estadoFase(f, ents, proy).clase === "hecha").length;
  const actualizado = Math.max(ms(S.meta && S.meta.actualizadoEn) || 0, ...S.cambios.slice(0, 1).map((c) => ms(c.en) || 0));
  const enCurso = ents.find((e) => e.estado === "en_curso");
  const siguiente = ents.find((e) => e.estado === "comprometido" || e.estado === "provisional");
  const pct = validos.length ? Math.round((hechos.length / validos.length) * 100) : 0;
  const desde = v && v.desde ? ms(v.desde) : Math.min(...ents.map((e) => ms(e.inicio)).filter(isFinite));
  const nombreProyecto = (S.meta && S.meta.nombre) || "";

  let panelCurso;
  if (enCurso) {
    const lleva = minutosEfectivos(ms(enCurso.inicio), Date.now());
    const previsto = enCurso.previstoMin || ritmo;
    const frac = isFinite(previsto) && previsto > 0 ? Math.min(lleva / previsto, 1) : 0.5;
    const fase = S.fases.find((f) => f.id === enCurso.fase);
    panelCurso = `<button class="encurso-titulo" style="background:none;border:0;padding:0;text-align:left" data-detalle="${esc(enCurso.id)}"><span class="codigo">${esc(enCurso.id)}</span><span>${esc(enCurso.titulo)}</span></button>
      <div class="sub">${esc(fase ? `${fase.codigo || et("fase", "Fase")} · ${fase.nombre}` : "")}${(enCurso.disciplinas || []).length ? " · " + esc(enCurso.disciplinas.map(nombreDisc).join(", ")) : ""}</div>
      <div class="fila-dato"><span>${t("empezo")} ${hora(ms(enCurso.inicio))} · ${t("lleva")} <b style="color:var(--texto)">${dur(lleva)}</b></span><span>${t("previsto")} ${dur(previsto)}</span></div>

  } else {

  }

  if (pa) panelCurso += `<div class="pausa-activa">${t("enPausa")} · ${esc(t(pa.motivo) || t("pausa"))} · ${t("desde")} ${hora(ms(pa.inicio))}${pa.detalle ? ` · ${esc(pa.detalle)}` : ""}</div>`;

    <span><b>${hechos.length}</b>/${validos.length} ${t("tareas")}</span>

// ── Seguimiento: Gantt
function vistaSeguimiento() {
  const v = versionActual();
  if (!v) return encabezado(t("tituloSeg")) + `<div class="aviso">${t("sinDatos")}</div>`;
  const { fases, ents } = datosVersion(v.id);
  const { proy } = proyectar(ents);
  const q = UI.busqueda.trim().toLowerCase();
  const coincide = (e) => !q || `${e.id} ${e.titulo}`.toLowerCase().includes(q);
  const grupos = UI.tab === "disciplinas"
    ? disciplinas().map((d) => ({ id: "d:" + d.id, codigo: "", nombre: d.nombre, ents: ents.filter((e) => (e.disciplinas || []).includes(d.id)) })).concat([{ id: "d:-", codigo: "", nombre: idioma() === "en" ? "No discipline" : "Sin disciplina", ents: ents.filter((e) => !(e.disciplinas || []).length) }]).filter((g) => g.ents.length)
    : fases.map((f) => ({ id: f.id, codigo: f.codigo || "", nombre: f.nombre, ents: ents.filter((e) => e.fase === f.id) }));
  const ancho = Math.max(320, (document.getElementById("raiz").clientWidth || 1000) - 300 - 2);

  const t1 = t0 + span;
  const x = (tm) => ((tm - t0) / span) * ancho;

  let izq = `<div class="g-cab">${esc(et("version", "Versión"))} · ${t("hechas")}</div>`;
  let der = "";
  for (const g of grupos) {
    const visibles = g.ents.filter(coincide);
    if (q && !visibles.length) continue;
    const abierta = q ? true : !UI.plegadas.has(g.id);
    const validos = g.ents.filter((e) => e.estado !== "descartado");
    const hechos = validos.filter((e) => e.estado === "hecho").length;
    izq += `<div class="g-fila fase ${abierta ? "abierta" : ""}" data-plegar="${esc(g.id)}" role="button" tabindex="0" aria-expanded="${abierta}"><span class="caret">›</span><span class="tit">${esc(g.codigo ? `${g.codigo} · ${g.nombre}` : g.nombre)}</span><span class="cnt">${hechos}/${validos.length}</span></div>`;
    // barra de la fase: del primer inicio al último fin (real o estimado)
    const tramos = g.ents.map((e) => proy.get(e.id)).filter(Boolean);
    let barraFase = "";
    if (tramos.length) {
      const a = Math.min(...tramos.map((p) => p.ini)), b = Math.max(...tramos.map((p) => p.fin));
      const todosHechos = validos.length && hechos === validos.length;
      barraFase = barraHtml(a, b, todosHechos ? "hecho" : validos.some((e) => e.estado === "en_curso") ? "hecho" : "comprometido", x, ancho, "fase", "", "");
    }
    der += `<div class="g-barra-fila fase">${barraFase}</div>`;
    if (!abierta) continue;
    for (const e of visibles) {
      izq += `<div class="g-fila tarea" data-detalle="${esc(e.id)}" role="button" tabindex="0"><span class="cuad" style="${cuadEstilo(e.estado)}"></span><span class="codigo" style="color:var(--tenue)">${esc(e.id)}</span><span class="tit" ${e.estado === "descartado" ? 'style="text-decoration:line-through;color:var(--tenue)"' : ""}>${esc(e.titulo)}</span></div>`;
      const p = proy.get(e.id);
      let barra = "";
      if (p) {
        const et2 = e.estado === "en_curso" ? `${e.titulo} · ${t("desde")} ${hora(p.ini)}` : p.estimado ? `${e.titulo} · ${t("est")} ${hora(p.ini)}` : `${e.titulo} · ${dur((p.fin - p.ini) / 6e4)}`;
        barra = barraHtml(p.ini, p.fin, e.estado, x, ancho, "", e.id, et2);
      }
      der += `<div class="g-barra-fila">${barra}</div>`;
    }
  }
  // escala: días arriba, marcas abajo
  const paso = { "6h": 36e5 / 2, "1d": 2 * 36e5, "3d": 6 * 36e5, "1s": 864e5, "1m": 7 * 864e5, "3m": 14 * 864e5 }[UI.zoom];
  let marcas = "", grilla = "", dias = "";
  const inicioDia = (tm) => { const d = new Date(tm); d.setHours(0, 0, 0, 0); return d.getTime(); };
  for (let tm = Math.ceil(t0 / paso) * paso; tm <= t1; tm += paso) {
    const etq = paso < 864e5 ? hora(tm) : fecha(tm);
    marcas += `<span style="left:${x(tm)}px">${etq}</span>`;
    grilla += `<div class="g-grilla" style="left:${x(tm)}px"></div>`;
  }
  if (span <= 7 * 864e5) for (let d = inicioDia(t0); d <= t1; d += 864e5) {
    if (d >= t0) grilla += `<div class="g-linea-dia" style="left:${x(d)}px"></div>`;
    if (d < t0 && x(d + 864e5) < 130) continue;
    dias += `<span style="left:${Math.max(0, x(d))}px">${new Date(d).toLocaleDateString(loc(), { weekday: "short", day: "numeric", month: "short" })}</span>`;
  } else dias = `<span style="left:0">${fecha(t0)} → ${fecha(t1)}</span>`;
  const ahora = Date.now();
  const grupos2 = [];
  let etPausas = "";
  for (const p of tramosPausa().filter((p) => p.b >= t0 && p.a <= t1).sort((a, b) => a.a - b.a)) {
    const g = grupos2[grupos2.length - 1];
    if (g && p.a - g.b <= 6e4) { g.tramos.push(p); g.b = Math.max(g.b, p.b); } else grupos2.push({ a: p.a, b: p.b, tramos: [p] });
  }
  const pausas = grupos2.map((g) => {
    const gx0 = Math.max(0, x(g.a)), gx1 = Math.min(ancho, x(g.b));
    const tramos = g.tramos.map((p) => {
      const x0 = Math.max(gx0, x(p.a)) - gx0, x1 = Math.min(gx1, x(p.b)) - gx0;
      const nombre = t(p.motivo) || t("pausa");
      const titulo = `${nombre} · ${fechaHora(p.a)} → ${p.fin ? hora(p.b) : t("ahora").toLowerCase()} · ${dur((p.b - p.a) / 6e4)}${p.detalle ? ` · ${p.detalle}` : ""}`;
      // rótulo arriba, en la fila del día, solo si entra
      if (x1 - x0 >= 70) etPausas += `<span class="g-pausa-et" style="left:${gx0 + x0}px;width:${x1 - x0}px" title="${esc(titulo)}">${esc(nombre)}</span>`;
      return `<i class="${esc(p.motivo || "otro")}" style="left:${x0}px;width:${Math.max(1, x1 - x0)}px" title="${esc(titulo)}"></i>`;
    }).join("");
    return `<div class="g-pausa" style="left:${gx0}px;width:${Math.max(2, gx1 - gx0)}px">${tramos}</div>`;
  }).join("");
  const lineaAhora = ahora >= t0 && ahora <= t1 ? `<div class="g-ahora" style="left:${x(ahora)}px"><b>${t("ahora").toUpperCase()}</b></div>` : "";

  const zooms = ZOOMS.map(([z]) => `<button class="chip" aria-pressed="${UI.zoom === z}" data-zoom="${z}">${ZOOM_ET[idioma()][z]}</button>`).join("");
  return encabezado(t("tituloSeg")) + `
  <div class="barra-herr"><div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${UI.tab === "fases"}" data-tab="fases">${esc(et("fasePlural", idioma() === "en" ? "Phases" : "Fases"))}</button>
    <button class="tab" role="tab" aria-selected="${UI.tab === "disciplinas"}" data-tab="disciplinas">${esc(et("disciplinaPlural", idioma() === "en" ? "Disciplines" : "Disciplinas"))}</button>
  </div></div>
  <div class="herr">
    <input type="search" id="buscar" placeholder="${t("buscar")} ${esc(et("entregablePlural", idioma() === "en" ? "deliverables" : "entregables")).toLowerCase()}" value="${esc(UI.busqueda)}" aria-label="${t("buscar")}">
    <button class="chip" data-accion="desplegar" title="${t("desplegar")}">⇊</button><button class="chip" data-accion="plegar" title="${t("plegar")}">⇈</button>
    ${zooms}<span class="espacio"></span>
    <button class="chip" data-accion="atras" aria-label="‹">‹</button><button class="chip" data-accion="ahora">${t("ahora")}</button><button class="chip" data-accion="adelante" aria-label="›">›</button>
  </div>
  <div class="gantt"><div class="g-izq">${izq}</div>
    <div class="g-der" style="height:${52 + 31 * (izq.match(/class="g-fila/g) || []).length}px">${grilla}<div class="g-dias">${dias}</div><div class="g-horas">${marcas}</div>${pausas}${etPausas}${lineaAhora}<div class="g-filas">${der}</div></div>
  </div>
  <div class="leyenda">
    <span><i style="background:var(--hecho)"></i>${t("hecho")}</span>
    <span><i style="background:var(--acento)"></i>${t("en_curso")}</span>
    <span><i style="background:var(--comprometido);border:1px solid #56657a"></i>${t("comprometido")} (${t("estimado")})</span>
    <span><i style="border:1px dashed var(--provisional)"></i>${t("provisional")} (${t("estimado")})</span>
    <span><i style="border:1px solid var(--bloqueado)"></i>${t("bloqueado")}</span>
    <span><i style="background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--tenue) 35%, transparent) 0 2px, transparent 2px 6px);border:1px dashed color-mix(in srgb, var(--tenue) 50%, transparent)"></i>${t("pausa")}</span>
    <span><i style="border-left:1px dashed var(--acento);width:1px"></i>${t("ahora")}</span>
  </div>`;
}
function cuadEstilo(estado) {
  if (estado === "provisional") return "border:1px solid var(--provisional)";
  if (estado === "comprometido") return "border:1px solid #8a9bb0;background:var(--comprometido)";
  return `background:${COLOR_ESTADO[estado] || "var(--provisional)"}`;
}
function barraHtml(a, b, estado, x, ancho, extra, id, etiqueta) {
  let x0 = x(a), x1 = x(b);
  if (x1 < 0 || x0 > ancho) return "";
  x0 = Math.max(x0, -2); x1 = Math.min(x1, ancho + 2);
  const w = Math.max(3, x1 - x0);
  const huecos = tramosPausa().filter((p) => p.b > a && p.a < b).map((p) => {
    const h0 = Math.max(x0, x(Math.max(a, p.a))), h1 = Math.min(x1, x(Math.min(b, p.b)));
    return h1 - h0 >= 1 ? `<i class="bar-hueco" style="left:${h0 - x0}px;width:${h1 - h0}px"></i>` : "";
  }).join("");
  const et2 = etiqueta && x1 + 8 < ancho ? `<span class="bar-et" style="left:${x1 + 8}px">${esc(etiqueta)}</span>` : "";
  return `<div class="bar ${estado} ${extra}" style="left:${x0}px;width:${w}px" ${id ? `data-detalle="${esc(id)}" title="${esc(etiqueta)}"` : ""}>${huecos}</div>${et2}`;
}

// ── Versiones: tablero por fases
function vistaVersiones() {

  const { fases, ents } = datosVersion(v.id);

  const opciones = [...S.versiones].sort((a, b) => (b.orden ?? 0) - (a.orden ?? 0)).map((x) => `<option value="${esc(x.id)}" ${x.id === v.id ? "selected" : ""}>${esc(x.id)}${x.estado ? ` · ${esc(x.estado === "publicada" ? (idioma() === "en" ? "released" : "publicada") : x.estado === "en_desarrollo" ? (idioma() === "en" ? "in development" : "en desarrollo") : (idioma() === "en" ? "planned" : "planificada"))}` : ""}</option>`).join("");

    const cats = [...porCat.entries()].map(([c, lista]) => {
      const clave = `${f.id}|${c}`;
      const abierta = UI.catsAbiertas.has(clave);

        const cap = (e.capturas || [])[0];
        return `<div class="tarjeta" data-detalle="${esc(e.id)}" role="button" tabindex="0"><div class="tarjeta-banda" style="background:color-mix(in srgb, ${COLOR_ESTADO[e.estado]} 22%, transparent);color:${e.estado === "comprometido" ? "#c9d3df" : COLOR_ESTADO[e.estado]}">${t(e.estado)}</div><div class="tarjeta-tit"><span class="codigo" style="color:var(--tenue)">${esc(e.id)}</span> ${esc(e.titulo)}</div>${cap ? `<img src="/_blob/${esc(cap.asset)}" alt="${esc(cap.nombre || e.titulo)}" loading="lazy">` : ""}</div>`;
      }).join("") : "";
      return `<div class="cat"><button class="cat-cab" data-cat="${esc(clave)}" aria-expanded="${abierta}"><span><b>${esc(c === "-" ? (idioma() === "en" ? "No discipline" : "Sin disciplina") : nombreDisc(c))}</b><small>${lista.length} ${lista.length === 1 ? t("entrada") : t("entradas")}</small></span><span class="puntos">${lista.map((e) => `<i style="${cuadEstilo(e.estado)}"></i>`).join("")}</span><span class="caret" style="${abierta ? "transform:rotate(90deg)" : ""}">›</span></button>${tarjetas}</div>`;
    }).join("");
    return `<section class="col ${est.clase}"><div class="col-cab"><div class="ver">${esc(v.id)}</div><div class="nom">${esc(f.codigo || f.nombre)}</div>${f.codigo ? `<div class="desc">${esc(f.nombre)}</div>` : ""}<span class="sello" style="color:${est.color}">${esc(est.texto)}</span>${est.clase === "curso" ? `<div class="barra" style="margin:10px 0 0"><i style="width:${total.length ? (hechos / total.length) * 100 : 0}%;background:var(--acento)"></i></div>` : ""}</div>${cats || `<p class="vacio" style="text-align:center">${t("sinDato")}</p>`}</section>`;
  }).join("");
  return encabezado(t("tituloVer")) + `

// ── Detalle de un entregable
function abrirDetalle(id) {
  const e = S.entregables.find((x) => x.id === id);
  if (!e) return;
  UI.detalle = id; UI.captura = 0;
  pintarDetalle();
  const dlg = document.getElementById("detalle");
  if (!dlg.open) dlg.showModal();
}
function pintarDetalle() {

  if (!e) { if (dlg.open) dlg.close(); return; }
  const fase = S.fases.find((f) => f.id === e.fase);
  const caps = e.capturas || [];
  const cap = caps[UI.captura] || caps[0];
  const lineas = Object.entries(e.lineas || {}).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...lineas.map((l) => l[1]));
  const ini = ms(e.inicio), fin = ms(e.fin);
  const efectivo = isFinite(ini) ? minutosEfectivos(ini, isFinite(fin) ? fin : Date.now()) : NaN;
  const conPausas = isFinite(ini) && Math.abs(efectivo - ((isFinite(fin) ? fin : Date.now()) - ini) / 6e4) >= 1;
  const periodo = isFinite(ini) ? `${fechaHora(ini)} → ${isFinite(fin) ? fechaHora(fin) + " · " + dur(efectivo) : t("en_curso").toLowerCase()}${conPausas ? ` (${t("sinPausas")})` : ""}` : e.previstoMin ? `${t("previsto")} ${dur(e.previstoMin)}` : t("sinDato");

    <div class="det-meta"><span class="sello" style="color:${COLOR_ESTADO[e.estado]}">${t(e.estado)}</span>${fase ? `<span>${esc(fase.codigo ? `${fase.codigo} · ${fase.nombre}` : fase.nombre)}</span>` : ""}${(e.disciplinas || []).map((d) => `<span>${esc(nombreDisc(d))}</span>`).join("")}${e.agente ? `<span>${esc(e.agente)}</span>` : ""}</div></div>
    <button class="cerrar" data-accion="cerrar" aria-label="${t("cerrar")}">×</button></div>
  <div class="det-cuerpo">
    <div>
      ${cap ? `<div class="galeria"><img class="principal" src="/_blob/${esc(cap.asset)}" alt="${esc(cap.nombre || e.titulo)}">${caps.length > 1 ? `<div class="miniaturas">${caps.map((c, i) => `<button aria-pressed="${i === UI.captura}" data-captura="${i}" aria-label="${esc(c.nombre || String(i + 1))}"><img src="/_blob/${esc(c.asset)}" alt=""></button>`).join("")}</div>` : ""}<div class="archivo">${esc(cap.nombre || "")}</div></div>` : ""}
      <h3>${t("fechas")}</h3>
      <div class="fila-dato"><span>${t("periodo")}</span><span>${esc(periodo)}</span></div>
      ${(e.dependeDe || []).length ? `<div class="fila-dato"><span>${t("dependeDe")}</span><span>${e.dependeDe.map((d) => `<button class="dep" data-detalle="${esc(d)}">${esc(d)}</button>`).join("")}</span></div>` : ""}
      ${e.estado === "bloqueado" && e.motivoBloqueo ? `<div class="fila-dato"><span>${t("motivo")}</span><span style="color:var(--bloqueado)">${esc(e.motivoBloqueo)}</span></div>` : ""}
      ${lineas.length ? `<h3>${esc(et("disciplinaPlural", idioma() === "en" ? "Disciplines" : "Disciplinas"))} · ${t("lineasPorDisc")}</h3>${lineas.map(([d, n]) => `<div class="disc-barra"><span>${esc(nombreDisc(d))}</span><div class="barra"><i style="width:${(n / max) * 100}%"></i></div><span>${n}</span></div>`).join("")}` : ""}
    </div>
    <div>
      ${bloque(t("queIncluye"), e.incluye)}

    </div>
  </div>`;

// ── Render y eventos
let pendiente = false;
function render() {
  if (pendiente) return;
  pendiente = true;
  requestAnimationFrame(() => {
    pendiente = false;
    const raiz = document.getElementById("raiz");
    const foco = document.activeElement && document.activeElement.id === "buscar" ? document.activeElement.selectionStart : null;
    document.documentElement.lang = idioma();
    if (S.meta && /^#[0-9a-f]{3,8}$/i.test(S.meta.acento || "")) document.documentElement.style.setProperty("--acento", S.meta.acento);
    document.getElementById("marca").textContent = (S.meta && (S.meta.sigla || S.meta.nombre)) || "Roadmap";
    document.title = S.meta && S.meta.nombre ? `${S.meta.nombre} · Roadmap` : "Roadmap en vivo";
    document.querySelectorAll("[data-t]").forEach((n) => (n.textContent = t(n.dataset.t)));
    document.querySelectorAll(".nav-btn").forEach((b) => (b.dataset.ir === UI.vista ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    if (S.db === "sin") { raiz.innerHTML = `<div class="eyebrow"><span>Roadmap</span></div><h1>Roadmap</h1><div class="aviso">${t("sinDb")}</div>`; return; }
    raiz.innerHTML = UI.vista === "versiones" ? vistaVersiones() : UI.vista === "notas" ? vistaNotas() : vistaSeguimiento();
    if (foco != null) { const b = document.getElementById("buscar"); if (b) { b.focus(); b.setSelectionRange(foco, foco); } }
    if (UI.detalle && document.getElementById("detalle").open) pintarDetalle();
  });
}
function irA(vista) { UI.vista = ["seguimiento", "versiones", "notas"].includes(vista) ? vista : "seguimiento"; render(); }
window.addEventListener("hashchange", () => irA(location.hash.slice(1)));
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-ir],[data-detalle],[data-plegar],[data-zoom],[data-tab],[data-accion],[data-estado],[data-cat],[data-nota],[data-captura]");
  if (!el) return;
  const d = el.dataset;
  if (d.ir) { location.hash = d.ir; irA(d.ir); }
  else if (d.detalle) abrirDetalle(d.detalle);
  else if (d.plegar) { UI.plegadas.has(d.plegar) ? UI.plegadas.delete(d.plegar) : UI.plegadas.add(d.plegar); render(); }
  else if (d.zoom) { UI.zoom = d.zoom; UI.corrimiento = 0; guardarUI(); render(); }
  else if (d.tab) { UI.tab = d.tab; UI.plegadas.clear(); guardarUI(); render(); }
  else if (d.estado) { UI.estados.has(d.estado) ? UI.estados.delete(d.estado) : UI.estados.add(d.estado); render(); }
  else if (d.cat) { UI.catsAbiertas.has(d.cat) ? UI.catsAbiertas.delete(d.cat) : UI.catsAbiertas.add(d.cat); render(); }
  else if (d.nota) { UI.tipoNota = d.nota; render(); }
  else if (d.captura) { UI.captura = Number(d.captura); pintarDetalle(); }
  else if (d.accion) {
    const span = ZOOMS.find((z) => z[0] === UI.zoom)[1];
    if (d.accion === "cerrar") { document.getElementById("detalle").close(); }
    else if (d.accion === "atras") { UI.corrimiento -= span / 2; render(); }
    else if (d.accion === "adelante") { UI.corrimiento += span / 2; render(); }
    else if (d.accion === "ahora") { UI.corrimiento = 0; render(); }
    else if (d.accion === "plegar") { const v = versionActual(); if (v) { const { fases } = datosVersion(v.id); (UI.tab === "fases" ? fases.map((f) => f.id) : disciplinas().map((x) => "d:" + x.id).concat(["d:-"])).forEach((id) => UI.plegadas.add(id)); } render(); }
    else if (d.accion === "desplegar") { UI.plegadas.clear(); render(); }
    else if (d.accion === "cats-desplegar" || d.accion === "cats-plegar") {
      const v = versionActual(); if (!v) return;
      const { fases, ents } = datosVersion(v.id);
      UI.catsAbiertas.clear();
      if (d.accion === "cats-desplegar") for (const f of fases) for (const e of ents.filter((x) => x.fase === f.id)) UI.catsAbiertas.add(`${f.id}|${(e.disciplinas || [])[0] || "-"}`);
      render();
    }
  }
});
document.addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[role=button][data-detalle],[role=button][data-plegar]")) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("input", (ev) => { if (ev.target.id === "buscar") { UI.busqueda = ev.target.value; render(); } });
document.addEventListener("change", (ev) => { if (ev.target.id === "sel-version") { UI.version = ev.target.value; UI.catsAbiertas.clear(); render(); } });
document.getElementById("detalle").addEventListener("close", () => { UI.detalle = null; });
new ResizeObserver(() => { if (UI.vista === "seguimiento") render(); }).observe(document.getElementById("raiz"));
setInterval(render, 30000); // "hace N min", la barra en curso y la línea de ahora; no escribe nada

// ── Datos en vivo
irA(location.hash.slice(1));
(async () => {
  const db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null;
  if (!db) { S.db = "sin"; render(); return; }
  S.db = "ok";
  const caida = () => { S.db = "error"; render(); };
  const lista = (col, q, clave) => (q || db.collection(col)).onSnapshot((snap) => { S[clave] = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })); render(); }, caida);
  db.doc("meta/proyecto").onSnapshot((d) => { S.meta = d.exists ? d.data() : null; render(); }, caida);
  lista("versiones", null, "versiones");
  lista("fases", null, "fases");
  lista("entregables", null, "entregables");
  lista("cambios", db.collection("cambios").orderBy("en", "desc").limit(300), "cambios");
  lista("notas", db.collection("notas").orderBy("en", "desc").limit(500), "notas");
  lista("pausas", db.collection("pausas").orderBy("inicio", "desc").limit(500), "pausas");
  render();
})();
</script>
